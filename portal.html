<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Portal | JobCrest</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css?v=72"></head><body class="portal-body"><main class="portal-shell"><header class="portal-header"><div class="brand"><img src="icon.svg" alt="" class="brand-icon"><div><strong>JobCrest Customer Portal</strong><span>Projects, documents, and payments</span></div></div><button class="ghost-button hidden" id="portalSignOut">Sign out</button></header><section class="surface portal-login" id="portalLogin"><p class="eyebrow">Secure customer access</p><h1>View your project</h1><p>Use the email address invited by your roofing representative.</p><form id="portalLoginForm" class="auth-form"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Sign in</button></form><p class="auth-status" id="portalStatus"></p></section><section class="hidden" id="portalWorkspace"><div class="portal-welcome"><p class="eyebrow">Customer workspace</p><h1 id="portalWelcome">Your projects</h1></div><div class="portal-grid" id="portalSummary"></div><section class="surface"><h2>Messages</h2><div id="portalMessages" class="compact-record-list"></div><form id="portalMessageForm"><label>Message your project team<textarea name="body" rows="4" maxlength="5000" required></textarea></label><button class="primary-button" type="submit">Send message</button></form></section></section></main><script src="auth-config.js" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous" defer></script><script src="portal.js?v=1" defer></script></body></html>
